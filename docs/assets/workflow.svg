<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Media Downloader workflow</title>
  <desc id="desc">Chrome detects accessible media, a local companion prepares a user-selected task, and a worker writes the chosen video or audio file.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111c33"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" fill="#e5e7eb" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Media Downloader</text>
  <text x="60" y="106" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="18">User-controlled media preparation and download</text>
  <g filter="url(#shadow)" font-family="Segoe UI, sans-serif">
    <rect x="60" y="155" width="260" height="180" rx="18" fill="#172033" stroke="#334155"/>
    <circle cx="100" cy="198" r="18" fill="#38bdf8"/><text x="132" y="205" fill="#e5e7eb" font-size="22" font-weight="600">Chrome extension</text>
    <text x="88" y="250" fill="#cbd5e1" font-size="17">Detects HLS / DASH</text><text x="88" y="280" fill="#cbd5e1" font-size="17">Groups duplicate requests</text><text x="88" y="310" fill="#cbd5e1" font-size="17">Shows preview and duration</text>
    <rect x="470" y="155" width="260" height="180" rx="18" fill="#172033" stroke="#334155"/>
    <circle cx="510" cy="198" r="18" fill="#a78bfa"/><text x="542" y="205" fill="#e5e7eb" font-size="22" font-weight="600">Local companion</text>
    <text x="498" y="250" fill="#cbd5e1" font-size="17">Prepares an in-memory job</text><text x="498" y="280" fill="#cbd5e1" font-size="17">Lets the user choose format</text><text x="498" y="310" fill="#cbd5e1" font-size="17">Controls start and cancel</text>
    <rect x="880" y="155" width="260" height="180" rx="18" fill="#172033" stroke="#334155"/>
    <circle cx="920" cy="198" r="18" fill="#34d399"/><text x="952" y="205" fill="#e5e7eb" font-size="22" font-weight="600">Media file</text>
    <text x="908" y="250" fill="#cbd5e1" font-size="17">yt-dlp + bundled FFmpeg</text><text x="908" y="280" fill="#cbd5e1" font-size="17">Video with audio or audio only</text><text x="908" y="310" fill="#cbd5e1" font-size="17">Saved to selected folder</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none"><path d="M335 245h115"/><path d="M745 245h115"/></g>
  <g fill="#64748b"><path d="M450 245l-16-10v20z"/><path d="M860 245l-16-10v20z"/></g>
  <text x="350" y="226" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">loopback API</text><text x="758" y="226" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">isolated worker</text>
</svg>
