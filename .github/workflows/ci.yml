name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Python lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Python types
        run: mypy app.py media_downloader
      - name: JavaScript lint and types
        run: |
          npm run lint
          npm run typecheck
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: JavaScript tests
        run: npm test
      - name: Dependency integrity and audit
        run: |
          python -m pip check
          pip-audit -r requirements.txt
